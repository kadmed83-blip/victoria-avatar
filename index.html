
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rémy - Test TalkingHead</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #202020;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #avatar {
            width: 100%;
            height: 85%;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #speak {
            padding: 14px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
        }
    }
    </script>
</head>

<body>

<div id="avatar"></div>

<div id="loading">
    Chargement de Rémy...
</div>

<div id="controls">
    <button id="speak">▶️ Faire parler Rémy</button>
    <button id="voiceCall">🎙️ Parler à Victoria</button>
</div>

<script type="module">

import { TalkingHead } from "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs";
import { HeadAudio } from "./modules/headaudio.mjs";

let head;
window.head = null;

document.addEventListener("DOMContentLoaded", async function () {

    const nodeAvatar = document.getElementById("avatar");
    const nodeLoading = document.getElementById("loading");

    head = new TalkingHead(nodeAvatar, {
        ttsEndpoint: "",
        cameraView: "upper",
        lipsyncLang: "fr"
    });

    window.head = head;

    await head.audioCtx.audioWorklet.addModule("./modules/headworklet.mjs");

    const headaudio = new HeadAudio(head.audioCtx, {
        processorOptions: {},
        parameterData: {
            vadGateActiveDb: -40,
            vadGateInactiveDb: -60
        }
    });

    await headaudio.loadModel("./dist/model-en-mixed.bin");
    head.audioSpeechGainNode.connect(headaudio);

    headaudio.onvalue = (key, value) => {
        Object.assign(head.mtAvatar[key], {
            newvalue: value,
            needsUpdate: true
        });
    };

    head.opt.update = headaudio.update.bind(headaudio);

    try {
        await head.showAvatar({
            url: "./avaturn.glb",
            avatarMood: "neutral",
            lipsyncLang: "en",
            avatarListeningEyeContact: 1,
            avatarSpeakingEyeContact: 1,
            avatarIgnoreCamera: false,
            avatarSpeakingHeadMove: 0.2
        }, function (ev) {
            if (ev.lengthComputable) {
                const val = Math.min(
                    100,
                    Math.round(ev.loaded / ev.total * 100)
                );

                nodeLoading.textContent =
                    "Chargement de Rémy : " + val + "%";
            }
        });

        nodeLoading.style.display = "none";
        console.log("RÉMY EST CHARGÉ");

    } catch (error) {
        console.error("ERREUR AVATAR :", error);
        nodeLoading.textContent = "Erreur : " + error.toString();
    }

    // Bouton de lecture via Render : conservé
    document.getElementById("speak").addEventListener("click", async function () {
        await head.audioCtx.resume();
        console.log("AudioContext activé :", head.audioCtx.state);

        const message = await fetch(
            "https://victoria-tts.onrender.com/next-text"
        ).then(r => r.json());

        if (!message.text) return;

        console.log("Victoria va parler :", message.text);
        console.log("Texte reçu :", message.text);
        console.log("Bouton Victoria cliqué");

        try {
            const response = await fetch(
                "https://victoria-tts.onrender.com/tts",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: message.text
                    })
                }
            );

            if (!response.ok) {
                throw new Error("Erreur TTS : " + response.status);
            }

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);

            const audioArrayBuffer = await audioBlob.arrayBuffer();
            const audioBuffer = await head.audioCtx.decodeAudioData(
                audioArrayBuffer
            );

            console.log(
                "AudioBuffer :",
                audioBuffer.duration,
                audioBuffer.sampleRate,
                audioBuffer.numberOfChannels
            );

            await head.speakAudio({
                audio: audioBuffer
            }, {
                lipsyncLang: "fr"
            });

            URL.revokeObjectURL(audioUrl);

        } catch (error) {
            console.error("ERREUR VOIX :", error);
        }
    });

    // Conversation vocale avec Victoria
    const voiceButton = document.getElementById("voiceCall");
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    let conversationActive = false;
    let recognition = null;
    let waitingForVictoria = false;

    voiceButton.addEventListener("click", async function () {
        if (!SpeechRecognition) {
            alert("La reconnaissance vocale n'est pas disponible. Essaie avec Chrome.");
            return;
        }

        if (conversationActive) {
            conversationActive = false;

            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }

            window.speechSynthesis.cancel();
            voiceButton.textContent = "🎙️ Parler à Victoria";
            return;
        }

        conversationActive = true;
        voiceButton.textContent = "⏳ Activation du micro…";

        try {
            await head.audioCtx.resume();
            startListening();

        } catch (error) {
            conversationActive = false;
            voiceButton.textContent = "🎙️ Parler à Victoria";
            alert("Impossible d'activer le son : " + error.message);
        }
    });

    function startListening() {
        if (!conversationActive || waitingForVictoria) return;

        try {
            recognition = new SpeechRecognition();
            recognition.lang = "fr-FR";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = async function (event) {
                const userText = event.results[0][0].transcript;

                waitingForVictoria = true;
                voiceButton.textContent = "⏳ Victoria réfléchit…";

                console.log("Message reconnu :", userText);

                try {
                    const response = await fetch(
                        "https://kadaria-2027.app.n8n.cloud/webhook/victoria-voice",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                text: userText,
                                sessionId: "victoria-kadar"
                            })
                        }
                    );

                    const responseBody = await response.text();

                    if (!response.ok) {
                        console.error(
                            "Erreur webhook n8n :",
                            response.status,
                            responseBody
                        );

                        throw new Error(
                            "Erreur webhook : " + response.status +
                            " — " + responseBody.slice(0, 500)
                        );
                    }

                    let data;

                    try {
                        data = JSON.parse(responseBody);
                    } catch (error) {
                        console.error(
                            "Réponse n8n non JSON :",
                            responseBody
                        );

                        throw new Error(
                            "La réponse du webhook n'est pas du JSON valide."
                        );
                    }

                    if (!data.text) {
                        throw new Error(
                            "Victoria n'a renvoyé aucune réponse."
                        );
                    }

                    console.log("Réponse de Victoria :", data.text);

                    // Synthèse vocale locale : ne passe pas par Render
                    const debutVoix = performance.now();

                    // Arrêter toute ancienne lecture en attente
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.resume();

                    // Sélectionner explicitement Microsoft Hortense
                    const voices = window.speechSynthesis.getVoices();

                    const frenchVoice =
                        voices.find(v =>
                            v.name.includes("Microsoft Hortense") &&
                            v.lang === "fr-FR" &&
                            v.localService
                        ) ||
                        voices.find(v =>
                            v.lang === "fr-FR" &&
                            v.localService
                        );

                    if (frenchVoice) {
                        console.log(
                            "Voix locale sélectionnée :",
                            frenchVoice.name,
                            frenchVoice.lang
                        );
                    } else {
                        console.warn(
                            "Aucune voix française locale trouvée ; " +
                            "Chrome utilisera sa voix par défaut."
                        );
                    }

                    // Laisser Chrome terminer l'annulation précédente
                    await new Promise(resolve => setTimeout(resolve, 100));

                    await new Promise((resolve, reject) => {
                        const utterance =
                            new SpeechSynthesisUtterance(data.text);

                        utterance.lang = "fr-FR";
                        utterance.rate = 1;
                        utterance.pitch = 1;

                        if (frenchVoice) {
                            utterance.voice = frenchVoice;
                        }

                        utterance.onstart = function () {
                            console.log(
                                "DÉBUT DE LA VOIX après réception :",
                                ((performance.now() - debutVoix) / 1000).toFixed(2),
                                "secondes"
                            );
                        };

                        utterance.onend = function () {
                            console.log("Fin de la voix de Victoria.");
                            resolve();
                        };

                        utterance.onerror = function (event) {
                            console.error(
                                "Erreur synthèse vocale :",
                                event.error
                            );

                            reject(
                                new Error(
                                    "Erreur de synthèse vocale : " +
                                    event.error
                                )
                            );
                        };

                        window.speechSynthesis.speak(utterance);
                        window.speechSynthesis.resume();
                    });

                } catch (error) {
                    console.error("Erreur Victoria :", error);

                    if (conversationActive) {
                        alert("Erreur : " + error.message);
                    }

                } finally {
                    waitingForVictoria = false;

                    if (conversationActive) {
                        voiceButton.textContent = "🎙️ Je relance l'écoute…";
                        setTimeout(startListening, 700);
                    } else {
                        voiceButton.textContent = "🎙️ Parler à Victoria";
                    }
                }
            };

            recognition.onerror = function (event) {
                console.error("Erreur micro :", event.error);

                if (
                    event.error !== "no-speech" &&
                    conversationActive
                ) {
                    conversationActive = false;
                    voiceButton.textContent = "🎙️ Parler à Victoria";

                    alert("Problème de micro : " + event.error);
                }
            };

            recognition.onend = function () {
                if (conversationActive && !waitingForVictoria) {
                    setTimeout(startListening, 700);
                }
            };

            voiceButton.textContent = "🎙️ Je t'écoute…";
            recognition.start();

        } catch (error) {
            console.error("Erreur de reconnaissance :", error);

            conversationActive = false;
            voiceButton.textContent = "🎙️ Parler à Victoria";

            alert("Impossible de démarrer le micro : " + error.message);
        }
    }

    // Surveillance automatique des messages : conservée
    let autoSpeechBusy = false;

    async function surveillerMessages() {
        if (autoSpeechBusy) {
            setTimeout(surveillerMessages, 1000);
            return;
        }

        try {
            if (head && head.audioCtx.state === "running") {
                autoSpeechBusy = true;

                const result = await fetch(
                    "https://victoria-tts.onrender.com/next-text"
                );

                if (!result.ok) {
                    throw new Error(
                        "Erreur /next-text : " + result.status
                    );
                }

                const message = await result.json();

                if (message.text) {
                    console.log(
                        "Victoria va parler automatiquement :",
                        message.text
                    );

                    const response = await fetch(
                        "https://victoria-tts.onrender.com/tts",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                text: message.text
                            })
                        }
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Erreur TTS : " + response.status
                        );
                    }

                    const audioBuffer =
                        await head.audioCtx.decodeAudioData(
                            await response.arrayBuffer()
                        );

                    await head.speakAudio(
                        { audio: audioBuffer },
                        { lipsyncLang: "fr" }
                    );
                }
            }

        } catch (error) {
            console.error(
                "Erreur de lecture automatique :",
                error
            );

        } finally {
            autoSpeechBusy = false;
            setTimeout(surveillerMessages, 700);
        }
    }

    setTimeout(surveillerMessages, 1000);

});

</script>

</body>
</html>
